services:
  db:
    image: postgres:16-alpine
    container_name: sahai-postgres
    restart: always
    environment:
      POSTGRES_USER: sahai_user
      POSTGRES_PASSWORD: sahai_password
      POSTGRES_DB: sahai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
